<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalTraveler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ヘッダーエリア -->
  <header class="app-header">
    <!-- 旅行の年表（右上） -->
    <aside class="timeline" aria-label="旅行の年表">
      <details id="timelineDetails" open>
        <summary>旅の年表</summary>
        <div id="timelineList"></div>
      </details>
    </aside>

    <h1>My Travel Plan</h1>
    <!-- 表示中の旅行：行き先・日程・あと○日 -->
    <p id="tripSummary" class="trip-summary" hidden></p>
    <!-- 旅行の切り替えバー -->
    <div class="trip-bar">
      <label for="tripSelect">旅行を選択</label>
      <select id="tripSelect"></select>
      <button type="button" id="newTripBtn">＋ 新しい旅行</button>
      <button type="button" id="deleteTripBtn" class="danger-btn">この旅行を削除</button>
    </div>
    <!-- 期日接近アラート（該当タスクがある場合のみ表示） -->
    <div id="alertArea" class="alert" hidden></div>
  </header>

  <main class="container">
    <!-- 基本情報セクション -->
    <section class="card">
      <h2>基本情報</h2>
      <div class="form-row">
        <label for="destination">行き先</label>
        <input type="text" id="destination" placeholder="例：台北・九份">
      </div>
      <div class="form-row">
        <label for="startDate">日程</label>
        <input type="date" id="startDate" aria-label="出発日">
        <span>〜</span>
        <input type="date" id="endDate" aria-label="帰着日">
        <span id="dateWarning" class="date-warning" hidden>帰着日が出発日より前になっています</span>
      </div>
      <div class="form-row">
        <label for="themeSelect">背景テーマ</label>
        <select id="themeSelect">
          <option value="">シンプル</option>
          <optgroup label="海・リゾート">
            <option value="theme-resort">リゾート</option>
            <option value="theme-tropical">南国の海</option>
            <option value="theme-sunset">サンセット</option>
          </optgroup>
          <optgroup label="自然・絶景">
            <option value="theme-nature">自然</option>
            <option value="theme-aurora">オーロラ</option>
            <option value="theme-snow">雪景色</option>
          </optgroup>
          <optgroup label="和風・京都">
            <option value="theme-wa">和モダン（青海波）</option>
            <option value="theme-sakura">桜</option>
            <option value="theme-momiji">紅葉</option>
            <option value="theme-matcha">抹茶</option>
            <option value="theme-kyoto-night">京の夜（灯り）</option>
          </optgroup>
          <optgroup label="都市">
            <option value="theme-night-city">都市（夜景）</option>
          </optgroup>
        </select>
      </div>
      <div class="form-row">
        <label for="imageFile">行き先の画像</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="form-row">
        <label for="imagePath">画像のURL</label>
        <input type="text" id="imagePath" placeholder="例：https://example.com/photo.jpg（ファイル選択でも可）">
        <button type="button" id="clearImageBtn" class="delete-btn">画像を外す</button>
      </div>
      <p class="hint">※ パソコン内のどのフォルダの画像でも選べます。選んだ画像は縮小して、この旅行のデータとして保存されます。</p>
      <div class="thumbnail">
        <img id="destinationImage" alt="行き先のイメージ" hidden>
        <p id="imageMessage" class="hint">画像が未設定です</p>
      </div>
    </section>

    <!-- 目的別リスト -->
    <div class="list-grid">
      <section class="card">
        <h2>そこでやりたいこと</h2>
        <form class="add-form" data-list="activities">
          <input type="text" placeholder="例：夜市で食べ歩き" required>
          <button type="submit">追加</button>
        </form>
        <ul class="item-list" id="list-activities"></ul>
      </section>

      <section class="card">
        <h2>行きたいレストラン</h2>
        <form class="add-form" data-list="restaurants">
          <input type="text" placeholder="例：鼎泰豊 信義本店" required>
          <button type="submit">追加</button>
        </form>
        <ul class="item-list" id="list-restaurants"></ul>
      </section>

      <section class="card">
        <h2>行きたいお店</h2>
        <form class="add-form" data-list="shops">
          <input type="text" placeholder="例：誠品書店" required>
          <button type="submit">追加</button>
        </form>
        <ul class="item-list" id="list-shops"></ul>
      </section>
    </div>

    <!-- 事前準備セクション -->
    <section class="card">
      <h2>準備しておくべきこと</h2>
      <form id="taskForm" class="add-form">
        <input type="text" id="taskName" placeholder="例：パスポートの有効期限確認" required>
        <input type="date" id="taskDueDate" required>
        <button type="submit">追加</button>
      </form>
      <ul class="item-list task-list" id="taskList"></ul>
    </section>
    <!-- 登録バー（画面下部に固定） -->
    <div class="register-bar">
      <span id="registerStatus" class="register-status"></span>
      <button type="button" id="registerBtn" class="register-btn">登録</button>
    </div>
  </main>

  <footer class="app-footer"><small>LocalTraveler</small></footer>

  <script src="app.js"></script>
</body>
</html>
